name: Android CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional. Debug builds fall back to https://api.lokmago.uz/ when unset. Fork PRs never receive secrets.
      API_GATEWAY_PASSWORD: ${{ secrets.API_GATEWAY_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4     # gradle-wrapper.jar must be an official Gradle build
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: app-debug, path: app/build/outputs/apk/debug/*.apk, retention-days: 7 }
