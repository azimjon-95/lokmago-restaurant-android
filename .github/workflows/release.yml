name: Release APK
# Manual only. Builds a SIGNED production APK, verifies it, and uploads it as an artifact.
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD   (see scripts/generate-keystore.sh)
#   GOOGLE_SERVICES_JSON_BASE64                                   (Firebase console -> base64 -w0 google-services.json)
# Optional: API_GATEWAY_PASSWORD (only if the backend sets GATEWAY_INBOUND_PASSWORD)
on:
  workflow_dispatch:
    inputs:
      version_code: { description: "versionCode (previous + 1)", required: true }
      version_name: { description: "versionName, e.g. 1.0.1", required: true }
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Production endpoints are public constants. The Gradle release guard rejects anything else.
      API_GATEWAY_URL: https://api.lokmago.uz
      SOCKET_URL: https://api.lokmago.uz
      API_PATH_PREFIX: restaurant/v1/
      SOCKET_PATH: /socket.io/
      API_GATEWAY_PASSWORD: ${{ secrets.API_GATEWAY_PASSWORD }}
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key and Firebase config
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          [ -n "$KS_B64" ] || { echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1; }
          [ -n "$GS_B64" ] || { echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is missing (release without FCM is not allowed)"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "$GS_B64" | base64 -d > app/google-services.json
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Assemble release (runs validateReleaseConfig first)
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Verify APK (signature, production host, no secrets)
        run: REQUIRE_APKSIGNER=1 scripts/verify-apk.sh app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
      - name: Remove key material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" app/google-services.json
